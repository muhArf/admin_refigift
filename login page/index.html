<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="fonts/icomoon/style.css">

    <link rel="stylesheet" href="css/owl.carousel.min.css">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    
    <!-- Style -->
    <link rel="stylesheet" href="css/style.css">
    <style>
      /* Custom styles to align form to the right */
      .contents {
        display: flex;
        justify-content: flex-start; /* Aligns content to the left */
      }
      .form-container {
        width: 100%; /* Optional: Set width to 100% to take full height */
        max-width: 400px; /* Optional: Set a max width for the form */
      }
      .create-account {
        text-align: center;
        margin-top: 20px; /* Add some space above the link */
      }
      .create-account a {
        color: #fb771a; /* Color for the link */
        text-decoration: none; /* Remove underline */
      }
      .create-account a:hover {
        text-decoration: underline; /* Underline on hover */
      }
    </style>

    <title>Login #2</title>
  </head>
  <body>
  

  <div class="d-lg-flex half">
    <div class="bg order-1 order-md-1" style="background-image: url('images/bg_1.jpg');"></div> <!-- Changed order here -->
    <div class="contents order-2 order-md-2"> <!-- Changed order here -->

      <div class="container form-container"> <!-- Added custom class here -->
        <div class="row align-items-center justify-content-center">
          <div class="col-md-12"> <!-- Changed to col-md-12 to take full width -->
            <h3>Login</h3>
            <p class="mb-4">Lorem ipsum dolor sit amet elit. Sapiente sit aut eos consectetur adipisicing.</p>
            <form action="#" method="post">
              <div class="form-group first">
                <label for="username">Username</label>
                <input type="text" class="form-control" placeholder="your-email@gmail.com" id="username">
              </div>
              <div class="form-group last mb-3">
                <label for="password">Password</label>
                <input type="password" class="form-control" placeholder="Your Password" id="password">
              </div>
              
              <div class="d-flex mb-5 align-items-center">
                <label class="control control--checkbox mb-0"><span class="caption">Remember me</span>
                  <input type="checkbox" checked="checked"/>
                  <div class="control__indicator"></div>
                </label>
                <span class="ml-auto"><a href="#" class="forgot-pass">Forgot Password</a></span> 
              </div>

              <input type="submit" value="Log In" class="btn btn-block btn-primary">

            </form>

            <!-- Create Account Section -->
            <div class="create-account">
              <p>Don't have an account? <a href="#">Create Account</a></p>
            </div>
            <!-- End of Create Account Section -->

          </div>
        </div>
      </div>
    </div>

    
  </div>
    
    

    <script src="js/jquery-3.3.1.min.js"></script>
    <script src="js/popper.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
